# Skill 来源配置
# 所有过滤后保留的 skill 将直接平铺同步至 skills/<skill-name>/ 目录，
# 以 100% 符合 Antigravity 2.0 插件一级目录自动发现规范 (skills/<skill-name>/SKILL.md)。
#
# mode: include — 只获取 include 列表中指定的精选高价值 skill
# mode: exclude — 获取该来源下所有 skill，排除 exclude 列表中的项
# mode: single  — 独立单技能仓库（仓库根目录或指定 path 直接包含 SKILL.md）

sources:
  - name: anthropics
    repo: anthropics/skills
    branch: main
    path: skills
    mode: include
    include:
      - doc-coauthoring
      - docx
      - frontend-design
      - mcp-builder
      - pdf
      - pptx
      - skill-creator
      - webapp-testing
      - xlsx

  - name: mattpocock-engineering
    repo: mattpocock/skills
    branch: main
    path: skills/engineering
    mode: include
    include:
      - diagnosing-bugs
      - tdd

  - name: context-hygiene
    repo: realmarigold/context-hygiene
    branch: main
    mode: single
