# Skill 来源默认配置（当仓库中无 sources.yaml 时回退使用）
# mode: exclude — 获取该来源下所有 skill，排除 exclude 列表中的项
# mode: include — 只获取 include 列表中指定的 skill

sources:
  - name: anthropics
    repo: anthropics/skills
    branch: main
    path: skills
    mode: exclude
    exclude:
      - brand-guidelines
      - internal-comms
      - academy-guide
      - discernment-nudge

  - name: mattpocock-engineering
    repo: mattpocock/skills
    branch: main
    path: skills/engineering
    mode: include
    include:
      - grill-with-docs
      - tdd
      - diagnosing-bugs
      - to-spec
      - wayfinder
      - improve-codebase-architecture

  - name: mattpocock-productivity
    repo: mattpocock/skills
    branch: main
    path: skills/productivity
    mode: include
    include:
      - grill-me
