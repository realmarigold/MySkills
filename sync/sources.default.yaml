# Skill 来源默认配置（当仓库中无 sources.yaml 时回退使用）
# mode: include — 只获取 include 列表中指定的精选高价值 skill
# mode: exclude — 获取该来源下所有 skill，排除 exclude 列表中的项
# mode: single  — 独立单技能仓库（仓库根目录或指定 path 直接包含 SKILL.md）

sources:
  - name: anthropics
    repo: anthropics/skills
    branch: main
    path: skills
    mode: include
    include:
      - doc-coauthoring
      - docx
      - frontend-design
      - mcp-builder
      - pdf
      - pptx
      - skill-creator
      - webapp-testing
      - xlsx

  - name: mattpocock-engineering
    repo: mattpocock/skills
    branch: main
    path: skills/engineering
    mode: include
    include:
      - diagnosing-bugs
      - tdd

  - name: context-hygiene
    repo: realmarigold/context-hygiene
    branch: main
    mode: single
